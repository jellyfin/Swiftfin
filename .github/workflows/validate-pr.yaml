name: "Validate PR 🧹"

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: "Validate PR 🧹"
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate localization changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 <<'PY'
          import os
          from pathlib import PurePosixPath
          import subprocess
          import sys

          changed_files = subprocess.check_output([
              "git", "diff", "--name-only", "--no-renames", "-z",
              f"{os.environ['BASE_SHA']}...{os.environ['HEAD_SHA']}", "--",
          ]).split(b"\0")
          blocked_files = [
              os.fsdecode(path) for path in changed_files if path and any(
                  part.endswith(".lproj") and part != "en.lproj"
                  for part in PurePosixPath(os.fsdecode(path)).parts[:-1]
              )
          ]

          if blocked_files:
              print("::error::Only en.lproj localization files may be changed. "
                    "Submit other translations through Weblate.")
              for path in blocked_files:
                  print(f"  {path!r}")
              sys.exit(1)

          print("Localization changes are limited to en.lproj.")
          PY

      - name: Run validation checks
        shell: bash
        run: |
          set -uo pipefail
          logs="$(mktemp -d)"
          trap 'rm -rf "$logs"' EXIT

          { time docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            ghcr.io/nicklockwood/swiftformat:0.63.0 \
            . --lint --config .swiftformat --cache ignore; } > "$logs/swiftformat" 2>&1 &
          format_pid=$!

          { time docker run --rm \
            -v "$GITHUB_WORKSPACE:/work:ro" -w /work \
            ghcr.io/realm/swiftlint:0.65.1 \
            lint --strict --config .swiftlint.yml --no-cache --quiet; } > "$logs/swiftlint" 2>&1 &
          lint_pid=$!

          { time swift Scripts/Translations/FindUnusedStrings.swift; } > "$logs/strings" 2>&1 &
          strings_pid=$!

          failures=0
          report_check() {
            local name="$1" pid="$2" log="$3"
            echo "::group::$name"
            if ! wait "$pid"; then
              echo "::error::$name failed"
              failures=1
            fi
            cat "$log"
            echo '::endgroup::'
          }

          report_check SwiftFormat "$format_pid" "$logs/swiftformat"
          report_check SwiftLint "$lint_pid" "$logs/swiftlint"
          report_check 'Unused strings' "$strings_pid" "$logs/strings"
          exit "$failures"
