name: "Build 🔨"

on:
  push:
    branches: [ main ]
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches: [ main ]

jobs:
  build:
    name: "Build 🔨"
    if: github.event.pull_request.draft == false
    strategy:
      matrix:
        scheme:
          - "Swiftfin"
          - "Swiftfin tvOS"

    runs-on: macos-26

    env:
      XCODE_VERSION: "26.6"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Install Homebrew dependencies
        run: brew bundle --file Brewfile

      # FIXME: caches would keep failed compiles?

      # - name: Cache Swift packages
      #   uses: actions/cache@v4
      #   with:
      #     path: PackageCache
      #     key: ${{ runner.os }}-${{ matrix.scheme }}-spm-${{ hashFiles('**/Package.resolved') }}
      #     restore-keys: ${{ runner.os }}-${{ matrix.scheme }}-spm-

      - name: Build
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 60
          command: bundle exec fastlane buildLane \
            scheme:"\"${{ matrix.scheme }}\"" \
            xcodeVersion:${{ env.XCODE_VERSION }}

      - name: Package unsigned IPA
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          set -euo pipefail
          mkdir -p fastlane/build/Payload
          cp -R fastlane/build/*.xcarchive/Products/Applications/*.app fastlane/build/Payload/
          cd fastlane/build
          zip -r -y "$SCHEME-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.scheme }}-unsigned
          path: fastlane/build/*-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
