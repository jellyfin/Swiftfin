name: CapsuleStylesTV
options:
  deploymentTarget:
    tvOS: "26.1"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  CapsuleStylesTV:
    type: application
    platform: tvOS
    sources:
      - Sources
      - ../../Shared/Components/ButtonStyles/CapsuleButtonStyle.swift
      - ../../Shared/Extensions/LabelStyle/HorizontalLabelStyle.swift
      - ../../Shared/Components/Layouts/AdaptiveLayout.swift
      - ../../Shared/Components/Layouts/AdaptiveColumns.swift
      - ../../Shared/Extensions/ViewExtensions/Backport/GlassEffect.swift
      - ../../Shared/Extensions/Color.swift
      - ../../Shared/Extensions/UIColor.swift
      - ../../Shared/Extensions/UIDevice.swift
      - ../../Shared/Extensions/CoordinateSpace.swift
      - ../../Shared/Extensions/EdgeInsets.swift
      - ../../Shared/Objects/FrameAndSafeAreaInsets.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.samples.CapsuleStylesTV
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Capsule Styles
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  CapsuleStylesTV:
    build:
      targets:
        CapsuleStylesTV: all
    run:
      config: Debug
